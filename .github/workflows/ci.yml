name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only is all this workflow needs: it runs tests and reports status.
permissions:
  contents: read

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing is information about that version, not a reason to
      # cancel the others and hide which ones were fine.
      fail-fast: false
      matrix:
        # The add-in runs inside Fusion's bundled interpreter, whose version has
        # moved across supported Fusion releases and is not ours to pick. AGENTS.md
        # therefore requires avoiding syntax newer than necessary; testing the
        # oldest version we plausibly need to support is what actually enforces
        # that, rather than trusting review to catch it.
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # tests/unit/test_palette_script_syntax.py parses the palette's inline
      # script with node, and *skips* when node is missing. Installing it
      # deliberately keeps that check from quietly disappearing from CI.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Confirm node is present
        run: node --version

      - name: Install test dependencies
        # The add-in vendors its only runtime dependency (PyYAML) and the suite
        # runs without Fusion installed, so pytest is genuinely all that is needed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run tests
        # -rs reports skips: a check that silently stopped running looks
        # identical to a passing one otherwise.
        run: python -m pytest tests/ -q -rs
